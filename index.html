<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Noir Detective: Solvable Engine</title>
  <style>
    :root { --bg: #0f0f12; --panel: #18181f; --accent: #c0392b; --gold: #f39c12; --text: #dcdde1; --border: #333340; }
    body { font-family: 'Georgia', serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    h1 { color: var(--accent); margin-bottom: 5px; }
    .controls { display: flex; gap: 10px; }
    button { background: var(--accent); color: white; border: none; padding: 10px 22px; font-weight: bold; border-radius: 4px; cursor: pointer; }
    button:hover { background: #e74c3c; }
    button.secondary { background: #34495e; }
    button.secondary:hover { background: #2c3e50; }
    .layout { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; max-width: 1250px; width: 100%; margin-top: 15px; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
    .clues-panel { width: 380px; }
    ul { padding-left: 20px; font-family: sans-serif; font-size: 0.9em; line-height: 1.5; }
    
    table.logic-grid { border-collapse: collapse; font-family: sans-serif; }
    table.logic-grid td, table.logic-grid th { border: 1px solid var(--border); text-align: center; width: 34px; height: 34px; font-size: 0.8em; }
    table.logic-grid th { background: #222; color: #aaa; }
    table.logic-grid th.rotate { height: 95px; white-space: nowrap; vertical-align: bottom; padding-bottom: 5px; }
    table.logic-grid th.rotate > div { transform: rotate(-90deg); width: 30px; margin: 0 auto; }
    .cell { cursor: pointer; font-weight: bold; font-size: 1.1em; user-select: none; }
    .cell.x { color: #e74c3c; }
    .cell.o { color: #2ecc71; background: rgba(46, 204, 113, 0.2); }
    .blocked { background: #111; }

    .accusation { display: flex; flex-direction: column; gap: 10px; font-family: sans-serif; margin-top: 10px; }
    .accusation-row { display: flex; justify-content: space-between; align-items: center; }
    select { background: #22222e; color: #fff; border: 1px solid var(--border); padding: 5px; border-radius: 4px; width: 60%; }
    
    .crime-report { background: rgba(192, 57, 43, 0.15); border: 1px solid var(--accent); padding: 10px; border-radius: 6px; margin-bottom: 15px; font-family: sans-serif; font-size: 0.9em; }
  </style>
</head>
<body>

  <h1>🕯️ Noir Detective: Murder Mystery Solver</h1>
  <div class="controls">
    <button onclick="generateGame()">Generate Guaranteed Solvable Case 🎲</button>
    <button class="secondary" onclick="clearNotebook()">Clear Notebook ↺</button>
  </div>

  <div class="layout">
    <div class="panel clues-panel">
      <div id="crime-report" class="crime-report"></div>

      <h3 style="color:var(--gold); margin-top:0;">📁 Case Evidence (<span id="clue-count">0</span> Clues)</h3>
      <ul id="clue-list"></ul>

      <hr style="border-color: var(--border); margin: 20px 0;">

      <h3 style="color:var(--gold);">⚖️ Final Accusation</h3>
      <div id="accusation-form" class="accusation"></div>
      <br>
      <button onclick="checkAccusation()" style="width:100%;">Submit Case File</button>
      <span id="status" style="display:block; margin-top:10px; font-family:sans-serif; font-weight:bold;"></span>
    </div>

    <div class="panel">
      <h3 style="color:var(--gold); margin-top:0;">📋 Detective Notebook</h3>
      <div id="grid-container"></div>
    </div>
  </div>

  <script>
    const SUSPECTS = ['Eleanor', 'Reginald', 'Pierre', 'James'];
    const WEAPONS = ['Poison', 'Dagger', 'Revolver', 'Rope'];
    const ROOMS = ['Library', 'Garden', 'Kitchen', 'Cellar'];

    let solution = {};
    let crimeDetails = {};
    let gridState = {};
    let currentClues = [];

    function shuffle(a) { return [...a].sort(() => Math.random() - 0.5); }

    function generateGame() {
      document.getElementById('status').innerText = '';

      let validPuzzleFound = false;
      let selectedClues = [];

      while (!validPuzzleFound) {
        // 1. Map Suspects to Weapons & Rooms
        const wShuf = shuffle(WEAPONS), rShuf = shuffle(ROOMS);
        solution = {};
        SUSPECTS.forEach((s, i) => solution[s] = { Weapon: wShuf[i], Room: rShuf[i] });

        // 2. Select the true Killer and crime specifics
        const killer = SUSPECTS[Math.floor(Math.random() * SUSPECTS.length)];
        crimeDetails = {
          killer: killer,
          weapon: solution[killer].Weapon,
          room: solution[killer].Room
        };

        // 3. Candidate Pool
        let pool = [];

        // Cross-category clues (Room <-> Weapon)
        SUSPECTS.forEach(s => {
          pool.push({
            text: `The <strong>${solution[s].Weapon}</strong> was located in the <strong>${solution[s].Room}</strong>.`,
            apply: (g) => setPositive(g, solution[s].Room, solution[s].Weapon, ROOMS, WEAPONS),
            check: (g) => g[`${solution[s].Room}_${solution[s].Weapon}`] === 'O'
          });
        });

        // Suspect-Weapon Positive Clues
        SUSPECTS.forEach(s => {
          pool.push({
            text: `<strong>${s}</strong> brought the <strong>${solution[s].Weapon}</strong>.`,
            apply: (g) => setPositive(g, s, solution[s].Weapon, SUSPECTS, WEAPONS),
            check: (g) => g[`${s}_${solution[s].Weapon}`] === 'O'
          });
        });

        // Suspect-Room Positive Clues
        SUSPECTS.forEach(s => {
          pool.push({
            text: `<strong>${s}</strong> was seen in the <strong>${solution[s].Room}</strong>.`,
            apply: (g) => setPositive(g, s, solution[s].Room, SUSPECTS, ROOMS),
            check: (g) => g[`${s}_${solution[s].Room}`] === 'O'
          });
        });

        // Negative Eliminations
        SUSPECTS.forEach(s => {
          WEAPONS.filter(w => w !== solution[s].Weapon).forEach(w => {
            pool.push({
              text: `<strong>${s}</strong> did NOT bring the <strong>${w}</strong>.`,
              apply: (g) => g[`${s}_${w}`] = 'X',
              check: (g) => g[`${s}_${w}`] === 'X'
            });
          });
          ROOMS.filter(r => r !== solution[s].Room).forEach(r => {
            pool.push({
              text: `<strong>${s}</strong> was NOT in the <strong>${r}</strong>.`,
              apply: (g) => g[`${s}_${r}`] = 'X',
              check: (g) => g[`${s}_${r}`] === 'X'
            });
          });
        });

        // Cross Negatives
        ROOMS.forEach(r => {
          let occ = SUSPECTS.find(s => solution[s].Room === r);
          WEAPONS.filter(w => w !== solution[occ].Weapon).forEach(w => {
            pool.push({
              text: `The <strong>${w}</strong> was NOT in the <strong>${r}</strong>.`,
              apply: (g) => g[`${r}_${w}`] = 'X',
              check: (g) => g[`${r}_${w}`] === 'X'
            });
          });
        });

        pool = shuffle(pool);
        selectedClues = [];

        // 4. Strict Non-Redundant Selection Loop
        for (let clue of pool) {
          let currentGrid = runSolver(selectedClues);
          
          if (clue.check(currentGrid)) continue;

          selectedClues.push(clue);

          let testGrid = runSolver(selectedClues);
          if (isFullySolved(testGrid)) {
            validPuzzleFound = true;
            break;
          }
        }
      }

      currentClues = selectedClues;

      // Render Initial Locked Crime Briefing
      document.getElementById('crime-report').innerHTML = `
        <strong>🔒 CASE FILE SEALED:</strong> Detective, details of the crime scene are locked. 
        Solve your notebook grid completely to reveal the murder scene and weapon!
      `;
      document.getElementById('clue-count').innerText = currentClues.length;
      document.getElementById('clue-list').innerHTML = currentClues.map(c => `<li>${c.text}</li>`).join('');

      renderFullLGrid();
      renderAccusationForm();
    }

    function clearNotebook() {
      renderFullLGrid();
      document.getElementById('status').innerText = '';
      document.getElementById('crime-report').innerHTML = `
        <strong>🔒 CASE FILE SEALED:</strong> Detective, details of the crime scene are locked. 
        Solve your notebook grid completely to reveal the murder scene and weapon!
      `;
      renderAccusationForm();
    }

    function setPositive(g, row, col, rowGroup, colGroup) {
      rowGroup.forEach(r => {
        colGroup.forEach(c => {
          if (r === row && c === col) g[`${r}_${c}`] = 'O';
          else if (r === row || c === col) g[`${r}_${c}`] = 'X';
        });
      });
    }

    function runSolver(clues) {
      let g = {};
      SUSPECTS.forEach(s => [...WEAPONS, ...ROOMS].forEach(i => g[`${s}_${i}`] = ''));
      ROOMS.forEach(r => WEAPONS.forEach(w => g[`${r}_${w}`] = ''));

      clues.forEach(c => c.apply(g));

      let changed = true;
      while (changed) {
        changed = false;

        const processSubGrid = (rowGroup, colGroup) => {
          rowGroup.forEach(r => {
            let empties = [], oFound = false;
            colGroup.forEach(c => {
              if (g[`${r}_${c}`] === 'O') oFound = true;
              if (g[`${r}_${c}`] === '') empties.push(c);
            });
            if (oFound) {
              colGroup.forEach(c => {
                if (g[`${r}_${c}`] === '') { g[`${r}_${c}`] = 'X'; changed = true; }
              });
            } else if (empties.length === 1) {
              setPositive(g, r, empties[0], rowGroup, colGroup);
              changed = true;
            }
          });

          colGroup.forEach(c => {
            let empties = [], oFound = false;
            rowGroup.forEach(r => {
              if (g[`${r}_${c}`] === 'O') oFound = true;
              if (g[`${r}_${c}`] === '') empties.push(r);
            });
            if (oFound) {
              rowGroup.forEach(r => {
                if (g[`${r}_${c}`] === '') { g[`${r}_${c}`] = 'X'; changed = true; }
              });
            } else if (empties.length === 1) {
              setPositive(g, empties[0], c, rowGroup, colGroup);
              changed = true;
            }
          });
        };

        processSubGrid(SUSPECTS, WEAPONS);
        processSubGrid(SUSPECTS, ROOMS);
        processSubGrid(ROOMS, WEAPONS);

        SUSPECTS.forEach(s => {
          ROOMS.forEach(r => {
            WEAPONS.forEach(w => {
              if (g[`${s}_${r}`] === 'O') {
                if (g[`${r}_${w}`] === 'O' && g[`${s}_${w}`] !== 'O') { setPositive(g, s, w, SUSPECTS, WEAPONS); changed = true; }
                if (g[`${r}_${w}`] === 'X' && g[`${s}_${w}`] !== 'X') { g[`${s}_${w}`] = 'X'; changed = true; }
              }
              if (g[`${s}_${w}`] === 'O') {
                if (g[`${r}_${w}`] === 'O' && g[`${s}_${r}`] !== 'O') { setPositive(g, s, r, SUSPECTS, ROOMS); changed = true; }
                if (g[`${r}_${w}`] === 'X' && g[`${s}_${r}`] !== 'X') { g[`${s}_${r}`] = 'X'; changed = true; }
              }
              if (g[`${r}_${w}`] === 'O') {
                if (g[`${s}_${r}`] === 'X' && g[`${s}_${w}`] !== 'X') { g[`${s}_${w}`] = 'X'; changed = true; }
                if (g[`${s}_${w}`] === 'X' && g[`${s}_${r}`] !== 'X') { g[`${s}_${r}`] = 'X'; changed = true; }
              }
            });
          });
        });
      }

      return g;
    }

    function isFullySolved(g) {
      return SUSPECTS.every(s => 
        WEAPONS.some(w => g[`${s}_${w}`] === 'O') && 
        ROOMS.some(r => g[`${s}_${r}`] === 'O')
      );
    }

    function renderFullLGrid() {
      gridState = {};
      let html = '<table class="logic-grid"><thead><tr><th></th><th></th>';
      
      [...WEAPONS, ...ROOMS].forEach(item => {
        html += `<th class="rotate"><div>${item}</div></th>`;
      });
      html += '</tr></thead><tbody>';

      SUSPECTS.forEach((s, idx) => {
        html += `<tr>${idx === 0 ? '<th rowspan="4">Suspects</th>' : ''}<th>${s}</th>`;
        [...WEAPONS, ...ROOMS].forEach(item => {
          let key = `${s}_${item}`;
          gridState[key] = '';
          html += `<td class="cell" id="c_${key}" onclick="cellClick('${s}', '${item}')"></td>`;
        });
        html += '</tr>';
      });

      ROOMS.forEach((r, idx) => {
        html += `<tr>${idx === 0 ? '<th rowspan="4">Rooms</th>' : ''}<th>${r}</th>`;
        WEAPONS.forEach(w => {
          let key = `${r}_${w}`;
          gridState[key] = '';
          html += `<td class="cell" id="c_${key}" onclick="cellClick('${r}', '${w}')"></td>`;
        });
        ROOMS.forEach(() => html += `<td class="blocked"></td>`);
        html += '</tr>';
      });

      html += '</tbody></table>';
      document.getElementById('grid-container').innerHTML = html;
    }

    function cellClick(rowItem, colItem) {
      let key = `${rowItem}_${colItem}`;
      let cell = document.getElementById(`c_${key}`);
      
      if (gridState[key] === '') {
        gridState[key] = 'X'; cell.innerText = 'X'; cell.className = 'cell x';
      } else if (gridState[key] === 'X') {
        gridState[key] = 'O'; cell.innerText = 'O'; cell.className = 'cell o';
        autoFillExclusions(rowItem, colItem);
      } else {
        gridState[key] = ''; cell.innerText = ''; cell.className = 'cell';
      }

      checkNotebookCompletion();
    }

    function autoFillExclusions(rowItem, colItem) {
      let rowGroup = SUSPECTS.includes(rowItem) ? SUSPECTS : ROOMS;
      let colGroup = WEAPONS.includes(colItem) ? WEAPONS : ROOMS;

      rowGroup.forEach(r => {
        colGroup.forEach(c => {
          if (r === rowItem && c !== colItem) setCellX(r, c);
          if (c === colItem && r !== rowItem) setCellX(r, c);
        });
      });
    }

    function setCellX(r, c) {
      let key = `${r}_${c}`;
      let cell = document.getElementById(`c_${key}`);
      if (cell && gridState[key] === '') {
        gridState[key] = 'X';
        cell.innerText = 'X';
        cell.className = 'cell x';
      }
    }

    function checkNotebookCompletion() {
      let solved = SUSPECTS.every(s => 
        WEAPONS.some(w => gridState[`${s}_${w}`] === 'O') && 
        ROOMS.some(r => gridState[`${s}_${r}`] === 'O')
      );

      if (solved) {
        document.getElementById('crime-report').innerHTML = `
          <strong style="color: #2ecc71;">🔓 CASE UNLOCKED:</strong> The victim was found murdered in the 
          <strong>${crimeDetails.room}</strong> with the <strong>${crimeDetails.weapon}</strong>. 
          Identify who was present with these details to close the file!
        `;

        document.getElementById('accused-weapon').value = crimeDetails.weapon;
        document.getElementById('accused-room').value = crimeDetails.room;
      }
    }

    function renderAccusationForm() {
      let html = `
        <div class="accusation-row">
          <strong>Killer:</strong>
          <select id="accused-killer">${SUSPECTS.map(s => `<option>${s}</option>`).join('')}</select>
        </div>
        <div class="accusation-row">
          <strong>Weapon:</strong>
          <select id="accused-weapon">${WEAPONS.map(w => `<option>${w}</option>`).join('')}</select>
        </div>
        <div class="accusation-row">
          <strong>Crime Scene:</strong>
          <select id="accused-room">${ROOMS.map(r => `<option>${r}</option>`).join('')}</select>
        </div>
      `;
      document.getElementById('accusation-form').innerHTML = html;
    }

    function checkAccusation() {
      let chosenKiller = document.getElementById('accused-killer').value;
      let chosenWeapon = document.getElementById('accused-weapon').value;
      let chosenRoom = document.getElementById('accused-room').value;

      let win = (chosenKiller === crimeDetails.killer) &&
                (chosenWeapon === crimeDetails.weapon) &&
                (chosenRoom === crimeDetails.room);
      
      let status = document.getElementById('status');
      status.style.color = win ? '#2ecc71' : '#e74c3c';
      status.innerText = win ? '✓ SOLVED! The culprit has been apprehended!' : '✗ INCORRECT! Check your detective notebook.';
    }

    generateGame();
  </script>
</body>
</html>
